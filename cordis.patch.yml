# Suggested replies is a Web bundle. It observes completed turns, asks the
# configured model for candidate next user messages, and projects them into the
# official strip immediately above the message input. Clicking a candidate
# writes the draft only; sending remains an explicit input-bar action.
- insert:
    - id: suggested-replies
      name: '@anionex/dsh-suggested-replies'
      config:
        enabled: true
        suggestionCount: 3
        contextMessageCount: 4
        maxSuggestionChars: 160
        maxTokens: 384
        timeoutMs: 15000
        # Optional explicit auxiliary route. Omit to inherit the current
        # session provider/model.
        # suggestionProvider: deepseek-official
        # suggestionModel: deepseek-v4-flash
        # Generation and routing
        followSessionRoute: true
        reasoningEffort: 'off'
        maxInputBytes: 4096
        maxRecentTurns: 1
        maxTranscriptChars: 12000
        maxContextTurns: 3
        maxContextContextBytes: 16384
        # Sanitization
        redactSecrets: true
        stripEscapes: true
        stripControls: true
        stripFencesAndQuotes: true
        collapseWhitespace: true
        singleLine: true
        # Semantic filtering
        filterMetaText: true
        filterErrorEcho: true
        filterEvaluative: true
        filterAssistantVoice: true
        filterMultiSentence: true
        filterTooLong: true
        allowSingleCommands: true
        filterFormatting: true
        # Manual generation
        manualShortcut: 'Mod+Shift+Space'
        manualReplacesDraft: true
        manualDedupe: true
        maxCycleSkipped: 10
        # Privacy and metrics
        maxLocalOutcomes: 50
        recordMetrics: true
        excludeNonHumanEvents: true
